[project]
name = "logfire-inference-observatory"
version = "0.1.0"
description = "A reproducible inference troubleshooting lab with Pydantic Logfire"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "logfire>=4.0", "pydantic-settings>=2.6", "httpx>=0.27"]

[project.scripts]
observatory = "observatory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "pillow>=11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/observatory"]
